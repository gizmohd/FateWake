name: Validate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-test-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Fatewake.slnx
      - name: Build
        run: dotnet build Fatewake.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test Fatewake.slnx --configuration Release --no-build
      - name: Validate artwork contract
        run: dotnet run --project tools/Fatewake.AssetValidator/Fatewake.AssetValidator.csproj -- .
