name: Validate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: fatewake_tests
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fatewake_tests"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:4-management
        env:
          RABBITMQ_DEFAULT_USER: fatewake_tests
          RABBITMQ_DEFAULT_PASS: test-only-password
        ports:
          - 127.0.0.1:5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Fatewake.slnx
      - name: Build
        run: dotnet build Fatewake.slnx --configuration Release --no-restore
      - name: Test with PostgreSQL and RabbitMQ
        env:
          FATEWAKE_TEST_CONNECTION: Host=localhost;Port=5432;Database=fatewake_tests;Username=postgres
          FATEWAKE_TEST_RABBITMQ: amqp://fatewake_tests:test-only-password@localhost:5672
        run: dotnet test Fatewake.slnx --configuration Release --no-build --no-restore --logger trx --results-directory artifacts/test-results
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results/**/*.trx
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish API
        run: dotnet publish src/Fatewake.Api/Fatewake.Api.csproj --configuration Release --no-build --no-restore --output artifacts/publish/api
      - name: Publish Web
        run: dotnet publish src/Fatewake.Web/Fatewake.Web.csproj --configuration Release --no-build --no-restore --output artifacts/publish/web
      - name: Upload applications
        uses: actions/upload-artifact@v4
        with:
          name: applications
          path: artifacts/publish/
          if-no-files-found: error
          retention-days: 14

  validate-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Validate artwork contract
        run: dotnet run --project tools/Fatewake.AssetValidator/Fatewake.AssetValidator.csproj --configuration Release -- .
